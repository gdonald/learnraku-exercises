name: CI

# Runs after the home lab's Jenkins build passes and reports the
# continuous-integration/jenkins/branch commit status. A status event runs
# this file from the default branch, so each job checks out the commit the
# status is for.
on:
  status

jobs:
  check:
    if: github.event.context == 'continuous-integration/jenkins/branch' && github.event.state == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.sha }}

      - name: Install Raku
        uses: Raku/setup-raku@v1

      - name: Install behave
        run: |
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge 3 ]; then echo "giving up after $n attempts: $*"; return 1; fi
              echo "retry $n/3: $*"
              sleep 5
            done
          }
          retry zef install --/test --force-install https://github.com/gdonald/BDD-Behave.git

      - name: Check exercises
        run: raku bin/check
